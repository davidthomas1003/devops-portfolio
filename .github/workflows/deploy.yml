name: Deploy to AWS ECS

on:
  push:
    branches:
      - aphrodite

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: docker build -t devops-portfolio-app ./app

      - name: Tag & push Docker image to ECR
        run: |
          ECR_URI=865091755851.dkr.ecr.us-east-1.amazonaws.com/devops-portfolio-repo
          docker tag devops-portfolio-app:latest $ECR_URI:latest
          docker push $ECR_URI:latest
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform init
        run: |
          cd terraform
          terraform init

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan

      - name: Terraform apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve
